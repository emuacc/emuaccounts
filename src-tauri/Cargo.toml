[package]
name = "emuaccounts"
version = "0.1.3"
edition = "2021"
rust-version = "1.98"
default-run = "emuaccounts"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
regex = "1"
thiserror = "1"
rhai = "1"
csv = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
# The sync build's metadata document (docs/SYNC.md); a default build reads the
# pre-TASK-133 trade links out of it without them (src/trade_links/automerge_doc.rs).
automerge = { version = "0.7", optional = true }
autosurgeon = { version = "0.10", optional = true }
# Already in the graph (png, lopdf, ureq); named here to inflate the metadata
# document's deflated columns.
flate2 = "1"
walkdir = "2"
machine-uid = "0.5"
hostname = { version = "0.4", optional = true }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
notify = "7"
tera = "1"
chrono = "0.4"
toml = "0.8"
parking_lot = "0.12"
# Already in the graph through tauri (which enables "sync"); named here for
# tokio::sync::watch, which tauri::async_runtime does not re-export.
tokio = { version = "1", features = ["sync"] }
tauri-plugin-webdriver-automation = { version = "0.1", optional = true }
pdf-extract = "0.12.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
webdriver = ["tauri-plugin-webdriver-automation"]
# Multi-device sync (relay, pairing, blob store) is half-baked: only a build
# with this feature compiles it. See docs/SYNC.md.
sync = ["dep:hostname", "dep:automerge", "dep:autosurgeon"]

[dev-dependencies]
cucumber = "=0.21.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
csv = "1"
tempfile = "3"
# The parser generated from Ledger.g4 is used only by the grammar parity tests
# (src/ledger_parser/grammar_parity.rs); release builds neither compile nor
# link it. See .backlog/decisions/decision-003.
antlr4rust = "=0.5.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

# Faster dev/test compile + link by emitting only line-table debug info.
# Trade-off: less detail when stepping in a debugger; line numbers in
# panic backtraces still work.
[profile.dev]
debug = "line-tables-only"

# Bins are thin CLI wrappers with no in-bin #[test] items. Their tested
# logic lives in the library and integration tests. Skip their test
# executables so cargo test doesn't compile + run them (several open the
# configured vault at startup).
[[bin]]
name = "ledger-parse"
path = "src/bin/ledger_parse.rs"
test = false

[[bin]]
name = "emuacc-relay"
path = "src/sync/relay_main.rs"
test = false
required-features = ["sync"]

[[bin]]
name = "emuacc-web"
path = "src/bin/emuacc_web.rs"
test = false

[[bin]]
name = "emuacc-import"
path = "src/bin/emuacc_import.rs"
test = false

[[bin]]
name = "emuacc-regenerate"
path = "src/bin/emuacc_regenerate.rs"
test = false

[[bin]]
name = "emuacc-gaps"
path = "src/bin/emuacc_gaps.rs"
test = false

[[bin]]
name = "emuacc-query"
path = "src/bin/emuacc_query.rs"
test = false

[[bin]]
name = "emuacc-issues"
path = "src/bin/emuacc_issues.rs"
test = false

[[bin]]
name = "emuacc-classify"
path = "src/bin/emuacc_classify.rs"
test = false

[[bin]]
name = "emuacc-reports"
path = "src/bin/emuacc_reports.rs"
test = false

[[bin]]
name = "emuacc-repair-trade-links"
path = "src/bin/emuacc_repair_trade_links.rs"
test = false

[[bin]]
name = "emuacc-migrate-rules"
path = "src/bin/emuacc_migrate_rules.rs"
test = false

[[bin]]
name = "emuacc-dedupe"
path = "src/bin/emuacc_dedupe.rs"
test = false

[[bin]]
name = "emuacc-update"
path = "src/bin/emuacc_update.rs"
test = false

[[bin]]
name = "emuacc-ai-import"
path = "src/bin/emuacc_ai_import.rs"
test = false

[[test]]
name = "bdd"
harness = false
