name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cargo-audit:
    name: Rust security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Report-only for now: the tree currently carries 10 vulnerabilities +
      # 26 warnings (largely the unmaintained gtk3-rs family via Tauri's Linux
      # target, plus a few real highs). Flip to blocking once task-024
      # remediates them — a red-from-day-one gate would just freeze PRs.
      - name: Run cargo audit
        working-directory: src-tauri
        continue-on-error: true
        run: cargo audit

  grammar-drift:
    name: Ledger grammar drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Java-only: regenerates from the grammars and fails on any diff. The
      # grammar conformance tests are ordinary lib tests and run in unit_bdd.
      - name: Verify committed generated parsers
        run: scripts/generate_ledger_parsers.sh --check

  unit_bdd:
    name: Unit + BDD tests
    runs-on: ubuntu-latest
    env:
      CI: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests (tsc, cargo test, Vitest with coverage thresholds)
        run: scripts/run_unit_tests.sh

      - name: BDD tests (Rust cucumber suite + UI suite dry-run)
        run: scripts/run_feature_tests.sh

      # Multi-device sync is compiled only with the `sync` feature
      # (docs/SYNC.md), so the two steps above never run its tests.
      - name: Sync build tests (cargo nextest + cucumber-rs, --features sync)
        run: scripts/run_sync_tests.sh
